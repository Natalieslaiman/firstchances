<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Chances</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@500&family=Courier+Prime&display=swap">
<style>
:root,:root[data-theme="dark"]{--bg:#12100e;--ink:#efe6d2;--glow:#f6e7a3;--card:#b48c5c;--mark:#1a1612;--mute:#8d8576;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12100e;--ink:#efe6d2;--glow:#f6e7a3;--card:#b48c5c;--mark:#1a1612;--mute:#8d8576}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 "Courier Prime","Courier New",monospace;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
h1,h2,.tape{font-family:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;font-weight:400}
.top{position:relative;text-align:center;padding:9vh 1.25rem 3rem;background:radial-gradient(ellipse at 50% 30%,#2b241c 0,var(--bg) 70%)}
.tape{display:inline-block;background:#d9c9a0;color:var(--mark);padding:.2rem 1.4rem;transform:rotate(-3deg);font-size:1rem;margin:0 0 2rem;box-shadow:0 2px 6px #0008}
h1{font-size:clamp(3rem,12vw,8.5rem);line-height:.95;margin:0 0 1.5rem;color:var(--glow);text-shadow:0 0 .35em #f6e7a3aa,0 0 1.2em #f6e7a355;transform:rotate(-1.5deg);animation:on 1.8s ease-out both}
@keyframes on{0%{opacity:0}12%{opacity:.9}18%{opacity:.2}30%{opacity:1}38%{opacity:.6}100%{opacity:1}}
.sub{max-width:32rem;margin:0 auto 2.5rem}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem}
.oval,nav a{display:inline-block;border:3px solid var(--ink);border-radius:55% 45% 52% 48%/58% 50% 50% 42%;padding:.5rem 1.8rem;color:var(--ink);text-decoration:none;font-family:"Permanent Marker",cursive;font-size:1.1rem}
nav a:nth-child(even){border-radius:48% 52% 45% 55%/45% 55% 48% 52%;transform:rotate(2deg)}
nav a:hover,nav a:focus-visible{background:var(--glow);color:var(--mark);border-color:var(--glow);outline:none}
.scope{background:#000;padding:clamp(.75rem,3vw,2.5rem) 0;margin:1rem 0 4rem}
.scope img{display:block;width:100%;aspect-ratio:2.39/1;object-fit:cover}
section{max-width:1000px;margin:0 auto;padding:2rem 1.25rem 3rem}
h2{text-align:center;margin:0 0 3rem;font-size:1.6rem;color:var(--glow)}
h2 span{display:inline-block;border:3px solid var(--glow);border-radius:52% 48% 55% 45%/50% 58% 42% 50%;padding:.4rem 2.2rem;transform:rotate(-2deg)}
figure{position:relative;margin:0 0 3.5rem;background:#000;padding:.5rem;box-shadow:0 14px 36px #000c;transform:rotate(-.7deg)}
figure:nth-of-type(even){transform:rotate(.6deg)}
figure::before,figure::after{content:"";position:absolute;top:-.9rem;width:5.5rem;height:1.7rem;background:#d9c9a0cc;box-shadow:0 1px 3px #0006}
figure::before{left:-1.2rem;transform:rotate(-35deg)}
figure::after{right:-1.2rem;transform:rotate(33deg)}
figure img{display:block;width:100%;aspect-ratio:2.39/1;object-fit:cover}
figcaption{font-family:Caveat,cursive;font-size:1.4rem;color:var(--mute);padding:.5rem .25rem 0;text-align:right}
.paper{background:var(--card);color:var(--mark);font-family:Caveat,cursive;font-size:1.8rem;text-align:center;padding:3rem 1rem;transform:rotate(.8deg);box-shadow:0 10px 26px #000a;margin:0 0 2rem}
footer{max-width:1000px;margin:2rem auto 0;padding:3rem 1.25rem 5rem;display:flex;flex-wrap:wrap;justify-content:center;gap:2rem}
.credit{border:3px solid var(--ink);border-radius:50% 50% 47% 53%/55% 45% 55% 45%;padding:1.6rem 2.4rem;text-align:center;max-width:22rem}
.credit:nth-child(2){transform:rotate(2deg)}
.credit b{display:block;font:400 1.2rem "Permanent Marker",cursive;color:var(--glow)}
@media (prefers-reduced-motion:reduce){h1{animation:none}html{scroll-behavior:auto}}
</style>
</head>
